<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Mesa MT5</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="color-scheme" content="dark">
<meta name="description" content="Mesa MT5 · Desk Chief — painel animado (dados de exemplo)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mesa MT5">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" width="34" height="34" aria-hidden="true">
        <polygon points="16,2 28,9 28,23 16,30 4,23 4,9" fill="none" stroke="var(--blue)" stroke-width="2"/>
        <polyline points="8,20 13,14 18,18 24,10" fill="none" stroke="var(--cyan)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <div class="title">Mesa MT5 · Desk Chief</div>
        <div class="sub">Exness · demo · 1:500</div>
      </div>
    </div>
    <span class="mode mono">SIMULAÇÃO</span>
  </header>

  <div class="sample"><span class="dot warn blink"></span><span>DADOS DE EXEMPLO · simulação visual</span></div>

  <div class="live">
    <span class="l"><span class="dot ok blink"></span><span id="clock">animação ativa · 00:00</span></span>
    <span class="t3">9 bots · sem ordens reais</span>
  </div>

  <main>
    <section id="v-Painel" class="view"></section>
    <section id="v-Bots" class="view" hidden></section>
    <section id="v-Pipeline" class="view" hidden></section>
    <section id="v-Risco" class="view" hidden></section>
    <p class="foot">Valores reais: equity demo, tetos de risco, estado dos bots. Tudo o resto é animação de exemplo.</p>
  </main>
</div>

<nav class="tabbar" id="tabbar" aria-label="Separadores">
  <button data-tab="Painel" aria-label="Painel"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Painel</span></button>
  <button data-tab="Bots" aria-label="Bots"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M12 7.5v4M12 11.5l-5.5 4.5M12 11.5l5.5 4.5"/></svg><span>Bots</span></button>
  <button data-tab="Pipeline" aria-label="Pipeline"><svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="18" r="2"/><path d="M6.5 7.5l4 3M13.5 13.5l4 3"/></svg><span>Pipeline</span></button>
  <button data-tab="Risco" aria-label="Risco"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg><span>Risco</span></button>
</nav>

<script src="app.js"></script>
</body>
</html>
